services:
  sa-db:
    image: mongo:8.2
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - sa-db-data:/data/db
    networks:
      - sa-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" mongodb://localhost:27017/admin | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sa-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      sa-db:
        condition: service_healthy
    ports:
      - "${PORT}:${PORT}"
    networks:
      - sa-network

networks:
  sa-network:
    name: sa-network

volumes:
  sa-db-data:
